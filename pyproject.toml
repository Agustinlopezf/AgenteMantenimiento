[project]
name = "troubleshooting-agent"
version = "0.1.0"
description = "Agente local de troubleshooting de mantenimiento industrial (oil & gas) sobre manuales de fabricantes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troubleshooting_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
